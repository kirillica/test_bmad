- id: "1"
  title: Загрузка XLS/XLSX и валидация структуры
  description: >-
    CAP-1, CAP-2: загрузка файла (выбор файла или drag-and-drop) с локальной
    обработкой и лимитом 30 000 строк; валидация обязательных колонок B–G,
    типов данных и пропусков по эталонной схеме.
  spec_checkpoint: true
  invoke_dev_with: >-
    Обработка строго локальная — файл не должен покидать устройство.
    Обязательный набор колонок B–G — по data-input-rules.md. Лимит 30 000
    строк на файл; сверх лимита — явное сообщение. Служебные строки-маркеры
    (заполнен только «Эпик») — предупреждать, не молча выкидывать.
    Недопустимый/повреждённый файл — ошибка без частичного состояния.
    UI на русском.
- id: "2"
  title: Предпросмотр, выбор листа и автоопределение типов
  description: >-
    CAP-3, CAP-4: предпросмотр первых строк выбранного листа и переключение
    листов; автоклассификация колонок на число, дату и текст.
  spec_checkpoint: true
  invoke_dev_with: >-
    Автоопределение типов: число, дата, текст. Распознанная колонка-дата
    активирует фильтр по дате. Числовые колонки H/I частично пустые — тип
    определяется по большинству непустых значений.
- id: "3"
  title: Фильтры по категориям и дате
  description: >-
    CAP-5: фильтры по категориям (Статус, Тип работы, Тип задачи, Исполнитель,
    Эпик) и по дате при наличии колонки-даты; применяются ко всем
    представлениям и снимаются.
  spec_checkpoint: true
  invoke_dev_with: >-
    Фильтр по дате доступен только при наличии распознанной колонки-даты
    (в эталонном образце её нет). Фильтры единовременно применяются ко всем
    представлениям CAP-6 и снимаются без сброса данных.
- id: "4"
  title: Визуализация — линейный, столбчатый, круговой графики и сводная таблица
  description: >-
    CAP-6: построение линейного, столбчатого, кругового графиков и сводной
    таблицы по загруженным или отфильтрованным данным; переключение
    представлений.
  spec_checkpoint: true
  invoke_dev_with: >-
    Типовые разрезы: трудозатраты (G) по Исполнителю, Типу работы, Статусу,
    Эпику. Переключение представлений не должно сбрасывать фильтры истории 3.
- id: "5"
  title: Экспорт результата
  description: >-
    CAP-7: экспорт графика в PNG/PDF и данных в XLSX; экспортированный
    артефакт соответствует текущему выбору на экране.
  spec_checkpoint: true
  invoke_dev_with: >-
    Экспорт формируется из текущего (отфильтрованного) состояния; артефакт
    должен совпадать с экраном. Графики — PNG/PDF, данные — XLSX.